networks:
  banking-network:
    driver: bridge

services:
  # ──────────────────────────────────────────────
  # MySQL 8.0 — Application Database
  # ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: online_banking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-online_banking}
      MYSQL_USER: ${MYSQL_USERNAME:-onlinebanking}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-onlinebanking}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - banking-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Keycloak 24.0 — Identity & Access Management
  # ──────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: online_banking-keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-9090}:8080"
    command: start-dev --import-realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - keycloak-data:/opt/keycloak/data
    networks:
      - banking-network

  # ──────────────────────────────────────────────
  # Spring Boot 3.2.5 — Backend API Service
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: online_banking-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-online_banking}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-onlinebanking}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-onlinebanking}
      KEYCLOAK_ISSUER_URI: http://localhost:9000/realms/online_banking
      KEYCLOAK_JWK_SET_URI: http://host.docker.internal:9000/realms/online_banking/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost,http://localhost:80,http://127.0.0.1:4200,http://127.0.0.1
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - banking-network

  # ──────────────────────────────────────────────
  # Angular 17 & Nginx — Frontend Client SPA
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: online_banking-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - banking-network

volumes:
  mysql-data:
  keycloak-data:
